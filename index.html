<title>寄り添いガイド 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column, one task per screen, fixed bottom action bar, persistent "人に聞く" */
:root{
  --bg:#f6f4f7; --card:#ffffff; --fg:#2a2430; --sub:#625a69; --line:#ddd6e1;
  --accent:#9c3f86; --accent-soft:#f6e6f1; --accent-ink:#6e2a5e; --ok:#2f7a5b; --ok-soft:#e4f2ea;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18151b; --card:#231f27; --fg:#f1ecf3; --sub:#b8aebf; --line:#3d3542;
  --accent:#e08ccc; --accent-soft:#3a2535; --accent-ink:#f4c6e8; --ok:#7fd0a8; --ok-soft:#1f3329; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18151b; --card:#231f27; --fg:#f1ecf3; --sub:#b8aebf; --line:#3d3542;
  --accent:#e08ccc; --accent-soft:#3a2535; --accent-ink:#f4c6e8; --ok:#7fd0a8; --ok-soft:#1f3329; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.75}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;z-index:2;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center}
.tag{font-family:var(--body);font-size:12px;font-weight:400;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--sub)}
.ask{font:inherit;font-size:15px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border:0;border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer}
main{flex:1;padding-block:20px 140px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:26px;line-height:1.45;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:20px;margin:0}
p{margin:0}
.lead{color:var(--sub)}
.save{font-size:14px;color:var(--ok);display:flex;align-items:center;gap:6px}
.save::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.choice{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;text-align:left;width:100%;min-height:60px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);display:flex;gap:12px;align-items:center;cursor:pointer}
.opt .box{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;font-size:16px;color:transparent}
.opt.round .box{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .box{border-color:var(--accent);background:var(--accent);color:var(--card)}
.opt:focus-visible,.btn:focus-visible,.ask:focus-visible,.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:3}
.bar-in{max-width:408px;margin:0 auto;display:flex;gap:10px}
.btn{font:inherit;font-weight:700;min-height:56px;border-radius:14px;padding:0 18px;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--fg)}
.btn.primary{flex:1;background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.back{flex:none}
.btn[aria-disabled="true"]{opacity:.45}
.hint{font-size:14px;color:var(--sub);text-align:center;margin-top:6px}
.err{font-size:15px;color:var(--accent-ink);background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.quote{border-left:4px solid var(--accent);padding:4px 0 4px 14px;border-radius:0}
.count{font-family:var(--display);font-size:44px;line-height:1;color:var(--accent)}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--accent)}
.qno{font-size:15px;color:var(--sub)}
.line{list-style:none;margin:0;padding:0}
.line li{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:18px}
.line li::before{content:"";position:absolute;left:16px;top:30px;bottom:-2px;width:3px;background:var(--line)}
.line li:last-child::before{display:none}
.line li.done::before{background:var(--ok)}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--sub);z-index:1}
.done .dot{border-color:var(--ok);background:var(--ok);color:var(--card)}
.now .dot{border-color:var(--accent);background:var(--accent);color:var(--card);box-shadow:0 0 0 6px var(--accent-soft)}
.st{min-width:0}
.st b{display:block}
.now .st{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-top:-6px}
.now .st b{color:var(--accent-ink)}
.small{font-size:15px;color:var(--sub)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.dl dt{color:var(--sub);font-size:15px}
.dl dd{margin:0}
.link{font:inherit;background:none;border:0;color:var(--accent-ink);text-decoration:underline;padding:6px 0;cursor:pointer;text-align:left}
.done-badge{display:inline-flex;gap:6px;align-items:center;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:4px 12px;font-size:15px;font-weight:700}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.consent input{width:26px;height:26px;margin-top:2px;accent-color:var(--accent)}
.note{font-size:13px;color:var(--sub);border-top:1px dashed var(--line);padding-top:12px}
@media (prefers-reduced-motion:no-preference){main{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">相続準備ガイド <span class="tag">試作品</span></div>
    <button class="ask" id="askBtn" type="button">人に聞く</button>
  </header>
  <main id="screen" aria-live="polite"></main>
</div>
<div class="bar" id="bar"><div class="bar-in" id="barIn"></div><p class="hint" id="barHint"></p></div>

<script>
const WORRIES=[
 {id:"talk",label:"家族で話したことがない",short:"家族とまだ話せていない"},
 {id:"where",label:"通帳や保険がどこにあるか、家族が知らない",short:"お金の置き場所を家族が知らない"},
 {id:"leave",label:"子どもに何を残せばいいか分からない",short:"何を残すか決められない"},
 {id:"dementia",label:"認知症になったら、お金はどうなるか心配",short:"判断が難しくなった後が心配"},
 {id:"tax",label:"相続税がかかるか分からない",short:"相続税がかかるか分からない"},
 {id:"tidy",label:"家や物の片付けが手つかず",short:"片付けが手つかず"}
];
const ROUTES={
 talk:[["子どもに伝えたいことを、1つだけ書く","メモ帳とペン","5分","1行書けたら完了です。うまく書けなくても大丈夫です。"],["話すきっかけを選ぶ","カレンダー","5分","次の帰省や電話の日を1つ決めたら完了です。"],["書いたメモを家族に見せる","書いたメモ","10分","見せられたら完了です。感想は聞かなくても大丈夫です。"],["銀行の人と一緒に、残りを整理する","これまでのメモ","30分","相談の予約ができたら完了です。"]],
 where:[["よく使う通帳を1冊だけ書き出す","通帳1冊","5分","銀行名と支店名を1つ書けたら完了です。"],["残りの通帳と保険証券を書き出す","通帳・保険証券","20分","思い出せる分だけ書けたら完了です。"],["置き場所を家族に伝える","書いたメモ","5分","1人に伝えられたら完了です。"],["銀行の人と、漏れがないか確かめる","これまでのメモ","30分","相談の予約ができたら完了です。"]],
 leave:[["残したいものを1つ書く","メモ帳とペン","5分","お金でも物でも、1つ書けたら完了です。"],["誰に残したいかを書く","書いたメモ","5分","名前を書けたら完了です。"],["生きているうちに渡す方法を知る","なし","10分","読み終えたら完了です。暦年贈与や遺言など、方法の違いを紹介します。"],["銀行の人に、自分に合う方法を聞く","これまでのメモ","30分","相談の予約ができたら完了です。"]],
 dementia:[["お金のことを頼みたい人を1人決める","なし","5分","名前が浮かんだら完了です。"],["生活費の希望を書く","メモ帳とペン","10分","毎月いくらくらい使いたいか書けたら完了です。"],["家族が代わりに払い出せる仕組みを知る","なし","10分","読み終えたら完了です。"],["銀行の人に相談する","これまでのメモ","30分","相談の予約ができたら完了です。"]],
 tax:[["財産のおおよその額を選ぶ","なし","3分","近いものを選べたら完了です。分からなくても進めます。"],["相続税がかかるかの目安を知る","なし","10分","読み終えたら完了です。"],["今からできる対策を知る","なし","10分","読み終えたら完了です。"],["銀行の人と試算する","これまでのメモ","30分","相談の予約ができたら完了です。"]],
 tidy:[["片付ける場所を1か所だけ決める","なし","3分","場所を決めたら完了です。"],["その場所の、残したい物を1つ選ぶ","なし","10分","1つ選べたら完了です。"],["家族に残したい物を伝える","なし","5分","1人に伝えられたら完了です。"],["専門の人に相談するか決める","なし","5分","決めたら完了です。"]]
};
const QS=[
 {q:"一緒に準備を考える人はいますか？",a:["夫・妻","子ども","ひとりで考えたい","わからない"]},
 {q:"お取引のある銀行は、いくつありますか？",a:["1つ","2〜3つ","4つ以上","わからない"]},
 {q:"相続のことを、家族と話したことはありますか？",a:["よく話す","少しだけ","ない","わからない"]}
];
const S={screen:"home",hist:[],worries:[],ans:{},q:0,step:0,from:null,contact:null,consent:false,booked:false,err:""};
const $=id=>document.getElementById(id);
function go(name){S.hist.push({screen:S.screen,q:S.q});S.screen=name;S.err="";render();window.scrollTo(0,0)}
function back(){const h=S.hist.pop();if(!h)return;S.screen=h.screen;S.q=h.q;S.err="";render();window.scrollTo(0,0)}
function route(){return ROUTES[S.worries[0]||"talk"]}
function wById(id){return WORRIES.find(w=>w.id===id)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function bar(buttons,hint){
  $("barIn").innerHTML=buttons.map(b=>`<button type="button" class="btn ${b.cls||""}" id="${b.id}" ${b.dis?'aria-disabled="true"':""}>${b.label}</button>`).join("");
  $("barHint").textContent=hint||"";
  buttons.forEach(b=>$(b.id).onclick=b.on);
  $("bar").hidden=!buttons.length;
}
const SAVE='<p class="save">答えは自動で保存されています。いつでも戻れます</p>';

const V={
home(){
  $("screen").innerHTML=`
   <h1>相続の準備、<br>何から始めればいいか<br>一緒に整理しましょう</h1>
   <p class="lead">いま気になっていることを選ぶだけで、あなたが次にやることを1つずつお伝えします。</p>
   <div class="card"><dl class="dl"><dt>かかる時間</dt><dd>3分ほど</dd><dt>入力するもの</dt><dd>名前や口座番号は不要です</dd><dt>途中でやめたら</dt><dd>続きから始められます</dd></dl></div>
   <button type="button" class="link" id="self">自分で調べたい方は、やることリストへ</button>`;
  $("self").onclick=()=>go("self");
  bar([{id:"start",label:"寄り添いガイドで始める",cls:"primary",on:()=>go("worry")}]);
},
self(){
  $("screen").innerHTML=`<h1>自分で調べるモード</h1><p class="lead">これまでどおりの「やることリスト」と「診断」を使えます。</p><div class="card small">試作品では、この先は既存のそうぞくガイドの画面を想定しています。</div>`;
  bar([{id:"b",label:"戻る",cls:"back",on:back}]);
},
worry(){
  $("screen").innerHTML=`
   <p class="qno">はじめに</p>
   <h1>いま、気になっていることは<br>どれですか？</h1>
   <p class="lead">いくつ選んでも大丈夫です。一番気になるものを先に選んでください。</p>
   ${S.err?`<p class="err" role="alert">${S.err}</p>`:""}
   <div class="choice">${WORRIES.map(w=>{const i=S.worries.indexOf(w.id);return `<button type="button" class="opt" aria-pressed="${i>=0}" data-id="${w.id}"><span class="box">${i>=0?i+1:""}</span><span>${w.label}</span></button>`}).join("")}
   <button type="button" class="opt" aria-pressed="${S.worries.includes('talk')&&S.ans.unsure?'true':'false'}" data-id="unsure"><span class="box"></span><span>よく分からない（ガイドにまかせる）</span></button></div>
   ${SAVE}`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    if(id==="unsure"){S.worries=["talk"];S.ans.unsure=true;}
    else{S.ans.unsure=false;const i=S.worries.indexOf(id);i>=0?S.worries.splice(i,1):S.worries.push(id);}
    S.err="";V.worry();
  });
  bar([{id:"b",label:"戻る",cls:"back",on:back},{id:"n",label:"次へ",cls:"primary",dis:!S.worries.length,on:()=>{if(!S.worries.length){S.err="1つ選んでください。分からないときは一番下を選べます。";V.worry();return}S.q=0;go("question")}}],"選んだあとで変えることもできます");
},
question(){
  const it=QS[S.q];const cur=S.ans["q"+S.q];
  $("screen").innerHTML=`
   <div class="prog" aria-hidden="true">${QS.map((_,i)=>`<i class="${i<=S.q?"on":""}"></i>`).join("")}</div>
   <p class="qno">質問 ${S.q+1} / ${QS.length}</p>
   <h1>${it.q}</h1>
   ${S.err?`<p class="err" role="alert">${S.err}</p>`:""}
   <div class="choice">${it.a.map(a=>`<button type="button" class="opt round" aria-pressed="${cur===a}" data-a="${esc(a)}"><span class="box">●</span><span>${a}</span></button>`).join("")}</div>
   ${SAVE}`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ans["q"+S.q]=b.dataset.a;S.err="";V.question()});
  bar([{id:"b",label:"戻る",cls:"back",on:back},{id:"n",label:S.q<QS.length-1?"次へ":"答え終わった",cls:"primary",dis:!cur,on:()=>{
    if(!S.ans["q"+S.q]){S.err="1つ選んでください。「わからない」でも進めます。";V.question();return}
    if(S.q<QS.length-1){S.hist.push({screen:"question",q:S.q});S.q++;S.err="";render();window.scrollTo(0,0)}else go("summary")}}]);
},
summary(){
  const main=wById(S.worries[0]);const others=S.worries.slice(1).map(wById);
  const r=route();
  $("screen").innerHTML=`
   <p class="qno">お話を整理しました</p>
   <h1>いちばん気になっているのは<br>「${main.short}」ですね</h1>
   <div class="card quote"><p>${S.ans.q2==="ない"?"まだ家族と話したことがないとのこと。最初から大きなことをしなくて大丈夫です。":"ここまで答えていただいた内容をもとに、無理のない順番を考えました。"}</p></div>
   <div class="card" style="display:flex;gap:16px;align-items:center"><span class="count">${r.length}</span><p>あなたがやることは<b>${r.length}つ</b>です。<br><span class="small">まずは最初の1つだけ。5分ほどで終わります。</span></p></div>
   ${others.length?`<p class="small">「${others.map(o=>o.short).join("」「")}」も、この準備が終わったらご案内します。</p>`:""}
   <button type="button" class="link" id="redo">答えを見直す</button>`;
  $("redo").onclick=()=>{S.q=0;go("worry")};
  bar([{id:"b",label:"戻る",cls:"back",on:back},{id:"n",label:"道のりを見る",cls:"primary",on:()=>go("route")}]);
},
route(){
  const r=route();const left=r.length-S.step;
  $("screen").innerHTML=`
   <p class="qno">あなたの道のり</p>
   <h1>${S.step>=r.length?"すべて終わりました":`つぎは、${r[S.step][0]}`}</h1>
   <p class="small">${S.step>=r.length?"お疲れさまでした。":`あと${left}つ。自分のペースで進めて大丈夫です。`}</p>
   <ol class="line">${r.map((s,i)=>{const st=i<S.step?"done":i===S.step?"now":"";return `<li class="${st}"><span class="dot">${i<S.step?"✓":i+1}</span><div class="st"><b>${s[0]}</b><span class="small">${i<S.step?"できました":i===S.step?"いまここ・"+s[2]+"ほど":s[2]+"ほど"}</span></div></li>`}).join("")}</ol>
   ${SAVE}`;
  bar(S.step>=r.length
    ?[{id:"b",label:"戻る",cls:"back",on:back},{id:"n",label:"銀行の人に相談する",cls:"primary",on:()=>{S.from="route";go("book")}}]
    :[{id:"b",label:"戻る",cls:"back",on:back},{id:"n",label:"この一歩をはじめる",cls:"primary",on:()=>go("step")}]);
},
step(){
  const s=route()[S.step];const last=S.step===route().length-1;
  $("screen").innerHTML=`
   <p class="qno">一歩め：${S.step+1} / ${route().length}</p>
   <h1>${s[0]}</h1>
   <div class="card"><dl class="dl"><dt>用意するもの</dt><dd>${s[1]}</dd><dt>時間</dt><dd>${s[2]}ほど</dd><dt>終わりの目安</dt><dd>${s[3]}</dd></dl></div>
   <p class="small">途中でやめても大丈夫です。次に開いたとき、ここから始まります。</p>
   <button type="button" class="link" id="line">続きをLINEで受け取る</button>`;
  $("line").onclick=()=>go("line");
  bar(last
    ?[{id:"b",label:"戻る",cls:"back",on:back},{id:"n",label:"相談を予約する",cls:"primary",on:()=>{S.from="step";go("book")}}]
    :[{id:"b",label:"戻る",cls:"back",on:back},{id:"n",label:"できた",cls:"primary",on:()=>{S.step++;go("cheer")}}]);
},
cheer(){
  const r=route();
  $("screen").innerHTML=`
   <span class="done-badge">✓ 一歩すすみました</span>
   <h1>できましたね</h1>
   <p class="lead">次は「${r[S.step][0]}」です。今日はここまでにしても大丈夫です。</p>`;
  bar([{id:"n",label:"道のりに戻る",cls:"primary",on:()=>go("route")}],"進んだところは保存されています");
},
book(){
  const main=wById(S.worries[0]);const r=route();
  $("screen").innerHTML=`
   <p class="qno">人に聞く</p>
   <h1>最初から説明しなくて<br>大丈夫です</h1>
   <p class="lead">ここまでの内容を担当者に伝えてから、お話しできます。</p>
   <div class="card"><h2 style="font-size:17px;margin-bottom:8px">担当者に伝わる内容</h2>
    <dl class="dl"><dt>気になること</dt><dd>${main.short}</dd><dt>いまの場所</dt><dd>${Math.min(S.step+1,r.length)} / ${r.length}「${r[Math.min(S.step,r.length-1)][0]}」</dd><dt>一緒に考える人</dt><dd>${S.ans.q0||"未回答"}</dd></dl></div>
   ${S.err?`<p class="err" role="alert">${S.err}</p>`:""}
   <p style="font-weight:700">相談の方法を選んでください</p>
   <div class="choice">${["電話で話す","お店で話す","LINEで聞く"].map(c=>`<button type="button" class="opt round" aria-pressed="${S.contact===c}" data-c="${c}"><span class="box">●</span><span>${c}</span></button>`).join("")}</div>
   <label class="consent" for="ok"><input type="checkbox" id="ok" ${S.consent?"checked":""}>上の内容を担当者に伝えることに同意します</label>
   <p class="note">試作品のため、実際の予約は行われません。</p>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.contact=b.dataset.c;S.err="";V.book()});
  $("ok").onchange=e=>{S.consent=e.target.checked;S.err=""};
  bar([{id:"b",label:"戻る",cls:"back",on:back},{id:"n",label:"この内容で予約する",cls:"primary",on:()=>{
    if(!S.contact){S.err="相談の方法を1つ選んでください。";V.book();return}
    if(!S.consent){S.err="担当者に伝えてよいか、チェックを入れてください。";V.book();return}
    go("booked")}}]);
},
booked(){
  $("screen").innerHTML=`
   <span class="done-badge">✓ 予約を受け付けました（試作）</span>
   <h1>担当者から<br>ご連絡します</h1>
   <div class="card"><dl class="dl"><dt>方法</dt><dd>${S.contact}</dd><dt>伝わる内容</dt><dd>気になること・いまの場所・答えた内容</dd></dl></div>
   <p class="lead">相談の日まで、道のりはそのまま残ります。</p>`;
  bar([{id:"n",label:"道のりに戻る",cls:"primary",on:()=>go("route")}]);
},
line(){
  $("screen").innerHTML=`
   <p class="qno">続きをLINEで</p>
   <h1>次の一歩を<br>LINEでお知らせします</h1>
   <div class="card"><dl class="dl"><dt>届く内容</dt><dd>次にやることと、道のりへの入口</dd><dt>頻度</dt><dd>週に1回まで。いつでも止められます</dd></dl></div>
   <p class="note">試作品のため、実際の登録は行われません。</p>`;
  bar([{id:"b",label:"戻る",cls:"back",on:back},{id:"n",label:"友だち追加する（試作）",cls:"primary",on:back}]);
},
ask(){
  $("screen").innerHTML=`
   <p class="qno">人に聞く</p>
   <h1>迷ったら、いつでも<br>人に聞けます</h1>
   <p class="lead">${S.worries.length?"ここまでの内容を担当者に伝えてから、お話しできます。":"何から聞けばいいか分からなくても大丈夫です。担当者が一緒に整理します。"}</p>`;
  bar([{id:"b",label:"戻る",cls:"back",on:back},{id:"n",label:"相談を予約する",cls:"primary",on:()=>{if(!S.worries.length)S.worries=["talk"];S.from="ask";S.screen="book";S.err="";render()}}]);
}
};
function render(){(V[S.screen]||V.home)();}
$("askBtn").onclick=()=>{if(S.screen!=="ask"&&S.screen!=="book")go("ask")};
render();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>寄り添いガイド 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column, one task per screen, fixed bottom action bar. Route = accordion timeline where each step opens in place */
:root{
  --bg:#f6f4f7; --card:#ffffff; --fg:#2a2430; --sub:#625a69; --line:#ddd6e1;
  --accent:#9c3f86; --accent-soft:#f6e6f1; --accent-ink:#6e2a5e; --ok:#2f7a5b; --ok-soft:#e4f2ea; --note:#fbf8e9; --note-line:#e6dcae;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18151b; --card:#231f27; --fg:#f1ecf3; --sub:#b8aebf; --line:#3d3542;
  --accent:#e08ccc; --accent-soft:#3a2535; --accent-ink:#f4c6e8; --ok:#7fd0a8; --ok-soft:#1f3329; --note:#2b2818; --note-line:#4d4628; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18151b; --card:#231f27; --fg:#f1ecf3; --sub:#b8aebf; --line:#3d3542;
  --accent:#e08ccc; --accent-soft:#3a2535; --accent-ink:#f4c6e8; --ok:#7fd0a8; --ok-soft:#1f3329; --note:#2b2818; --note-line:#4d4628; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.75}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;z-index:2;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center}
.tag{font-family:var(--body);font-size:12px;font-weight:400;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--sub)}
.ask{font:inherit;font-size:14px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border:0;border-radius:12px;padding:6px 12px;min-height:44px;cursor:pointer;line-height:1.3;text-align:center}
.ask small{display:block;font-weight:400;font-size:11px}
main{flex:1;padding-block:20px 150px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:26px;line-height:1.45;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:19px;margin:0}
p{margin:0}
.lead{color:var(--sub)}
.small{font-size:15px;color:var(--sub)}
.save{font-size:14px;color:var(--ok);display:flex;align-items:flex-start;gap:8px;line-height:1.6}
.save::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:7px}
.choice{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;text-align:left;width:100%;min-height:60px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);display:flex;gap:12px;align-items:center;cursor:pointer}
.opt .box{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;font-size:15px;color:transparent}
.opt.round .box{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .box{border-color:var(--accent);background:var(--accent);color:var(--card)}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:3}
.bar-in{max-width:408px;margin:0 auto;display:flex;gap:10px}
.btn{font:inherit;font-weight:700;min-height:56px;border-radius:14px;padding:0 16px;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--fg);line-height:1.3}
.btn small{display:block;font-size:12px;font-weight:400}
.btn.primary{flex:1;background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.back{flex:none;max-width:42%}
.btn.sm{min-height:48px;font-size:16px}
.btn[aria-disabled="true"]{opacity:.45}
.hint{font-size:13px;color:var(--sub);text-align:center;margin-top:4px}
.err{font-size:15px;color:var(--accent-ink);background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.quote{border-left:4px solid var(--accent);border-radius:0 12px 12px 0}
.count{font-family:var(--display);font-size:44px;line-height:1;color:var(--accent)}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--accent)}
.qno{font-size:15px;color:var(--sub)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.dl dt{color:var(--sub);font-size:15px}
.dl dd{margin:0;min-width:0}
.link{font:inherit;background:none;border:0;color:var(--accent-ink);text-decoration:underline;padding:6px 0;cursor:pointer;text-align:left;min-height:44px}
.answers{display:flex;flex-direction:column;gap:6px}
.ans{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15px}
.ans span{min-width:0}
.ans b{display:block;font-size:13px;color:var(--sub);font-weight:400}
.ans button{flex:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--accent-ink);border-radius:999px;padding:4px 12px;min-height:36px;cursor:pointer}
.kw{font-weight:700;text-decoration:underline;text-decoration-color:var(--note-line);text-decoration-thickness:3px;text-underline-offset:3px}
.term{font:inherit;background:none;border:0;padding:0;color:var(--accent-ink);text-decoration:underline dotted;text-underline-offset:4px;cursor:pointer}
.term::after{content:"？";font-size:.75em;margin-left:1px}
.gloss b{display:block;font-size:14px;color:var(--sub)}
.gloss{display:block;background:var(--note);border:1px solid var(--note-line);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:15px;color:var(--fg)}
.road{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.road>li{scroll-margin-top:84px;display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:12px;position:relative;padding-bottom:14px}
.road>li::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:3px;background:var(--line)}
.road>li:last-child::before{display:none}
.road>li.done::before{background:var(--ok)}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--sub);z-index:1}
.done .dot{border-color:var(--ok);background:var(--ok);color:var(--card)}
.now .dot{border-color:var(--accent);background:var(--accent);color:var(--card);box-shadow:0 0 0 5px var(--accent-soft)}
.acc{font:inherit;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:2px 0;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;min-height:44px}
.acc b{display:block}
.acc .chev{flex:none;color:var(--accent-ink);font-size:13px;margin-top:2px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--card);white-space:nowrap}
.now .acc b{color:var(--accent-ink)}
.panel.later{background:var(--bg);border-style:dashed}
.acc{cursor:default}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:6px;display:flex;flex-direction:column;gap:12px}
.now .panel{border:2px solid var(--accent)}
textarea{font:inherit;font-size:17px;width:100%;min-height:96px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--fg);resize:vertical}
.saved{font-size:13px;color:var(--ok)}
.flash{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:700}
.memo{background:var(--note);border:1px solid var(--note-line);border-radius:10px;padding:8px 12px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.consent input{width:26px;height:26px;margin-top:2px;accent-color:var(--accent);flex:none}
.note{font-size:13px;color:var(--sub);border-top:1px dashed var(--line);padding-top:12px}
.foot{font-size:13px;text-align:center}
.map{font-size:15px;line-height:1.7}
.map ol{margin:0;padding-left:1.3em}
.map li{margin:4px 0}
.map .br{border-left:3px solid var(--line);padding-left:10px;margin:4px 0 4px 4px;color:var(--sub)}
.flowwrap{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.sec,.flowwrap>.ans{scroll-margin-top:84px}
.sec+.sec{border-top:1px dashed var(--line);padding-top:24px}
.nextbtn{width:100%}
.btn.stepper{flex:1;background:var(--bg);border-color:var(--line);color:var(--sub);font-weight:400;font-size:14px}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:4px}
.steps i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.steps i.cur{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.kind{flex:none;font-size:12px;border-radius:999px;padding:2px 10px;white-space:nowrap;margin-top:2px}
.k-read,.k-write{background:var(--ok-soft);color:var(--ok)}
.k-calc{background:var(--note);color:var(--fg);border:1px solid var(--note-line)}
.undo{font:inherit;font-size:14px;font-weight:400;background:none;border:0;color:var(--ok);text-decoration:underline;padding:0 0 0 6px;min-height:32px;cursor:pointer}
.k-human{background:var(--accent-soft);color:var(--accent-ink)}
.result{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.result.safe{border-color:var(--ok)}
.result.maybe,.result.likely{border-color:var(--accent)}
.big{font-family:var(--display);font-size:22px;line-height:1.4}
.plainlist{margin:6px 0 10px;padding-left:1.3em;font-size:16px}
.plainlist li{margin:4px 0}
.plainlist li.isdone{color:var(--sub)}
.other{display:flex;flex-direction:column;gap:4px}
.inline-confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:15px}
main{-webkit-animation:fade .35s ease-out both;animation:fade .35s ease-out both}
.enter{-webkit-animation:fade .7s ease-out both;animation:fade .7s ease-out both}
.flash{-webkit-animation:fade .5s ease-out both;animation:fade .5s ease-out both}
.opt{transition:background-color .2s,border-color .2s}
@-webkit-keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@-webkit-keyframes rise{from{opacity:0;-webkit-transform:translateY(24px)}to{opacity:1;-webkit-transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
.enter{-webkit-animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">相続準備ガイド <span class="tag">試作品</span></div>
    <button class="ask" id="askBtn" type="button">担当者に相談<small>電話・お店・LINE</small></button>
  </header>
  <main id="screen" aria-live="polite"></main>
</div>
<div class="bar" id="bar"><div class="bar-in" id="barIn"></div><p class="hint" id="barHint"></p></div>

<script>
const GLOSS={
 "支店名":"通帳の表紙や1ページ目に書いてある「◯◯支店」のことです。",
 "保険証券":"保険に入ったときに届く、契約内容が書かれた書類です。",
 "権利証":"家や土地の持ち主であることを示す書類です。「登記識別情報」と書かれた紙の場合もあります。",
 "法定相続人":"法律で決まっている、財産を受け継ぐ人です。夫・妻と、子ども（子どもがいなければ親や兄弟）がなります。",
 "基礎控除":"相続税がかからない金額の上限です。3,000万円＋600万円×法定相続人の数で計算します。",
 "相続税":"亡くなった人の財産を受け取ったときにかかる税金です。財産が基礎控除より少なければかかりません。",
 "納税資金":"相続税を払うためのお金です。原則として10か月以内に現金で払います。",
 "暦年贈与":"1年間（1月〜12月）に110万円までの贈与なら、贈与税がかからない仕組みです。亡くなる前7年以内の贈与は相続財産に足し戻されます。",
 "非課税枠":"生命保険の受け取りは、500万円×法定相続人の数まで相続税がかかりません。",
 "二次相続":"夫・妻のどちらかが亡くなった後、残った人が亡くなったときの相続です。1回目の分け方で税金が変わることがあります。",
 "遺言":"自分が亡くなった後、財産を誰にどう分けるかを書き残すものです。決まった書き方があります。",
 "寄与分":"介護などで特に支えてくれた家族が、相続で多めに受け取れる場合がある仕組みです。",
 "成年後見":"判断が難しくなった人のお金や契約を、家庭裁判所が選んだ人が代わりに管理する仕組みです。",
 "家族信託":"元気なうちに、信頼できる家族にお金や家の管理を任せる契約です。"
};
const WORRIES=[
 {id:"where",label:"通帳や保険がどこにあるか、家族が知らない",short:"お金の置き場所を家族が知らない"},
 {id:"tax",label:"相続税がかかるか分からない",short:"相続税がかかるか分からない"},
 {id:"leave",label:"子どもに何を残せばいいか分からない",short:"何を残すか決められない"},
 {id:"dementia",label:"認知症になったら、お金はどうなるか心配",short:"判断が難しくなった後が心配"},
 {id:"talk",label:"家族で話したことがない",short:"家族とまだ話せていない"},
 {id:"tidy",label:"家や物の片付けが手つかず",short:"片付けが手つかず"},
 {id:"land",label:"家や土地をどうするか決めていない",short:"家や土地をどうするか決めていない"}
];
/* questions: rewording of the existing diagnosis + "対象の方" conditions */
const Q={
 spouse:{q:"夫・妻はいらっしゃいますか？",short:"夫・妻",a:["いる","いない","わからない"],src:"既存診断 Q1"},
 kids:{q:"お子さんは何人いますか？",short:"お子さん",a:["0人","1人","2人","3人以上","わからない"],src:"既存診断 Q2"},
 sibs:{q:"ご兄弟は何人いますか？",short:"ご兄弟",a:["0人","1人","2人","3人以上","わからない"],src:"既存診断 Q2",if:A=>A.kids==="0人"},
 assets:{q:"預金や株などは、全部でどのくらいですか？",short:"預金や株",a:["1,000万円未満","1,000万〜3,000万円","3,000万〜1億円","1億円以上","わからない"],src:"既存診断 Q3"},
 land:{q:"家や土地をお持ちですか？",short:"家や土地",a:["持っている","持っていない","わからない"],src:"既存診断 Q6"},
 banks:{q:"お取引のある銀行は、いくつありますか？",short:"銀行の数",a:["1つ","2〜3つ","4つ以上","わからない"],src:"既存診断 Q5"},
 debt:{q:"ローンや、借りているお金はありますか？",short:"借りているお金",a:["ある","ない","わからない"],src:"タスク0004の対象"},
 others:{q:"家族以外に、財産を渡したい人はいますか？",short:"家族以外に渡したい人",a:["いる","いない","わからない"],src:"タスク0025の対象"},
 will:{q:"遺言書を作ったことはありますか？",short:"遺言書",a:["ある","ない","わからない"],src:"タスク0031の対象"},
 care:{q:"いま、介護を受けていますか？",short:"介護",a:["受けている","受けていない"],src:"タスク0023の対象"},
 helper:{q:"お金のことを頼める家族はいますか？",short:"頼める家族",a:["いる","いない","わからない"],src:"タスク0028の対象"},
 note:{q:"エンディングノートは書いていますか？",short:"エンディングノート",a:["書いている","書いていない"],src:"タスク0032の対象"},
 grave:{q:"お墓のことで、決めていないことはありますか？",short:"お墓",a:["ある","ない","わからない"],src:"タスク0040・0041の対象"},
 pet:{q:"ペットを飼っていますか？",short:"ペット",a:["飼っている","飼っていない"],src:"タスク0044の対象"},
 landtype:{q:"お持ちのものを、すべて選んでください",short:"持っている家や土地",a:["自宅","二世帯住宅","空き家・別荘","貸している土地や建物","山林・農地","親の名義のままの土地","わからない"],multi:true,src:"既存診断 Q6"}
};
const QOF={where:["banks","land","debt"],tax:["spouse","kids","sibs","assets","land"],leave:["spouse","kids","sibs","others","will"],dementia:["care","helper"],talk:["kids","note"],tidy:["grave","pet"],land:["landtype"]};
/* steps: k = web | tool | human ; pd = existing task id */
const T=(o)=>o;
const ROUTES={
 where:[
  T({pd:"0001",t:"通帳を1冊ずつ、財産メモに書く",k:"tool",bring:"通帳",time:"10分",done:"銀行名と[[支店名]]、置き場所を1つ書けたら終わりです。",memo:"例：◯◯銀行 △△支店（タンスの上の引き出し）"}),
  T({pd:"0002",t:"株や投資信託の口座を、財産メモに書く",k:"tool",bring:"証券会社からの書類",time:"10分",done:"会社名と置き場所を書けたら終わりです。持っていなければ「できた」で進めます。",memo:"例：□□証券（書類は本棚の青いファイル）"}),
  T({pd:"0004",t:"借りているお金を書き出す",k:"web",bring:"ローンの書類",time:"10分",done:"借りている先と、残りのおおよその額を書けたら終わりです。",memo:"例：住宅ローン △△銀行 残り300万円くらい",if:A=>A.debt!=="ない"}),
  T({pd:"0003",t:"家や土地の[[権利証]]の置き場所を書く",k:"tool",bring:"[[権利証]]、固定資産税の通知",time:"10分",done:"置き場所を書けたら終わりです。",memo:"例：権利証は金庫の中",if:A=>A.land==="持っている"}),
  T({pd:"0043",t:"スマホやパソコンで使っているサービスを書き出す",k:"web",bring:"スマホ",time:"10分",done:"ネット銀行やよく使うサービスを1つ書けたら終わりです。",memo:"例：ネット銀行、写真の保存サービス"}),
  T({pd:"0007",t:"財産メモに漏れがないか、人に相談して確かめる",k:"human",pro:["税理士"],bring:"これまでの財産メモ",time:"30分",done:"相談の予約ができたら終わりです。相談は無料です。"})],
 tax:[
  T({pd:"0005",t:"誰が[[法定相続人]]になるかを確かめる",k:"tool",tool:"heirs",time:"1分",done:"人数が表示されたら終わりです。"}),
  T({pd:"0006",t:"[[相続税]]がかかるかの目安を見る",k:"tool",tool:"tax",time:"1分",done:"目安が表示されたら終わりです。"}),
  T({pd:"安心",t:"今は大きな対策は必要なさそうです",k:"web",time:"3分",done:"読み終えたら終わりです。目安を家族に伝えておくと安心です。次は、お金の置き場所の整理がおすすめです。",if:A=>taxResult(A).level==="safe"}),
  T({pd:"0021",t:"[[納税資金]]があるかを確かめる",k:"web",bring:"通帳",time:"10分",done:"預金で払えそうか、目安と見比べたら終わりです。",if:A=>taxResult(A).level!=="safe"}),

  const toolBody=s=>{
    if(s.tool==="heirs"){const h=heirs(S.ans);return `<div class="result"><p class="small">あなたの答えから</p><p class="big">${h.n?`法定相続人は ${h.n}人${h.approx?"以上":""}`:"まだ分かりません"}</p><p>${esc(h.who)}${h.spUnknown?"（夫・妻の答えが「わからない」のため、含めていません）":""}</p></div>`}
    if(s.tool==="tax"){const t=taxResult(S.ans);return `<div class="result ${t.level}"><p class="small">相続税の目安</p><p class="big">${t.title}</p><p>${t.body}</p><p class="small">あくまで目安です。自宅の土地は条件により評価が大きく下がる特例があるなど、実際とずれる場合があります。</p></div>`}
    return "";};
  $("screen").innerHTML=`
   <p class="qno">あなたの道のり：${wById(w).short}</p>
   <h1>${allDone?"すべて終わりました":`つぎは、${plain(all[cur].t)}`}</h1>
   <p class="small">${allDone?"お疲れさまでした。書いたメモはこの画面でいつでも見られます。":`あと${all.length-cur}つ。いまのステップは色が付いています。`}</p>
   <ol class="road">${shown.map((s,i)=>{
     const st=S.done[s.pd]?"done":i===cur?"now":"";const memo=S.memos[s.pd]||"";
     return `<li class="${st}" id="st${i}"><span class="dot" aria-hidden="true">${S.done[s.pd]?"✓":i+1}</span><div style="min-width:0">
      <div class="acc"><span><b>${plain(s.t)}</b><span class="small">${S.done[s.pd]?"できました":i===cur?"いまここ・"+s.time+"ほど":"このあと・"+s.time+"ほど"}</span></span><span class="kind k-${kindOf(s)}">${KIND[kindOf(s)]}</span></div>
      <div class="panel${S.anim==="r"+i?" enter":""}${i>cur?" later":""}">
        ${S.flash&&i===cur?`<p class="flash" role="status">✓ ${S.flash}${S.lastDone?` <button type="button" class="undo" data-undo="${S.lastDone}">取り消す</button>`:""}</p>`:""}
        <dl class="dl"><dt>やること</dt><dd>${rich(s.t)}</dd>${s.bring?`<dt>用意するもの</dt><dd>${rich(s.bring)}</dd>`:""}<dt>時間</dt><dd>${s.time}ほど</dd><dt>終わりの目安</dt><dd>${rich(s.done)}</dd><dt>元のタスク</dt><dd class="small">${/^\d/.test(s.pd)?"やることリスト "+s.pd:"寄り添いガイド独自の案内"}</dd></dl>
        ${glossBlock(s.t,s.bring,s.done)}
        ${toolBody(s)}
        ${s.memo?`<label for="m${s.pd}" style="font-weight:700;font-size:16px">${["0001","0002","0003"].includes(s.pd)?"財産メモ（書いた内容は保存されます）":"ここに書けます（書いた内容は保存されます）"}</label><textarea id="m${s.pd}" data-pd="${s.pd}" placeholder="${esc(s.memo)}">${esc(memo)}</textarea><span class="saved" id="sv${s.pd}">${memo?"保存しました":""}</span>`:""}
        ${i===cur?(s.k==="human"?`<p style="font-weight:700;font-size:16px">相談する相手を選べます</p><button type="button" class="btn primary" id="doBook">銀行の担当者に相談する<small>無料・電話/お店/LINE</small></button>${prosFor(s).length?`<button type="button" class="btn" id="doPro">${prosFor(s).join("・")}を探す<small>このサイトの専門家さがし</small></button>`:""}<button type="button" class="link" id="doDone">もう済んでいるので、次へ進む</button>`:`<button type="button" class="btn primary" id="doDone">できた</button><button type="button" class="link" id="doLine">続きをLINEで受け取る</button>`):""}
      </div></div></li>`}).join("")}</ol>
   ${later.length?`<div class="card"><h2 style="font-size:17px">この先にあること</h2><ul class="plainlist">${later.map(s=>`<li>${plain(s.t)}（${KIND[kindOf(s)]}）</li>`).join("")}</ul></div>`:""}
   ${S.worries.length>1?`<h2>ほかに選んだこと</h2>${S.worries.slice(1).map(o=>{const r=routeOf(o);const c=curIndex(r);return `<div class="card other"><p style="font-weight:700">${wById(o).short}</p><ol class="plainlist">${r.map((s,i)=>`<li class="${S.done[s.pd]?"isdone":""}">${S.done[s.pd]?"✓ ":""}${plain(s.t)} <span class="small">（${KIND[kindOf(s)]}）</span></li>`).join("")}</ol><button type="button" class="btn sm" data-swap="${o}">こちらを先に進める</button></div>`}).join("")}`:""}
   ${SAVE()}`;
  S.anim=null;
  document.querySelectorAll("textarea").forEach(t=>t.oninput=()=>{S.memos[t.dataset.pd]=t.value;persist();const s=$("sv"+t.dataset.pd);if(s)s.textContent="保存しました"});
  document.querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>{delete S.done[b.dataset.undo];S.flash="";S.lastDone=null;persist();V.route()});
  document.querySelectorAll("[data-swap]").forEach(b=>b.onclick=()=>{const o=b.dataset.swap;S.worries=[o,...S.worries.filter(x=>x!==o)];S.flash="";persist();V.route();window.scrollTo(0,0)});
  if($("doDone"))$("doDone").onclick=()=>{const s=all[cur];S.done[s.pd]=true;S.lastDone=s.pd;const nc=curIndex(routeOf(w));S.flash=`「${plain(s.t)}」ができました。次はこちらです`;S.anim="r"+nc;persist();V.route();setTimeout(()=>smoothTo($("st"+nc)),750)};
  if($("doBook"))$("doBook").onclick=()=>go("book");
  if($("doPro"))$("doPro").onclick=()=>{S.proFor=prosFor(all[cur]);go("pro")};
  if($("doLine"))$("doLine").onclick=()=>go("line");
  bar([{id:"b",label:backLabel(),cls:"back",on:back},{id:"n",label:"担当者に相談する",cls:"primary",on:()=>go("book")}],"相談すると、この道のりとメモを担当者に伝えられます");
},
book(){
  const has=S.worries.length>0;const memoCount=Object.values(S.memos).filter(Boolean).length;
  let where="";if(has){const r=routeOf(S.worries[0]);const c=curIndex(r);where=c<r.length?`${c+1} / ${r.length}「${plain(r[c].t)}」`:"すべて完了"}
  const t=has&&(S.worries.includes("tax"))?taxResult(S.ans):null;
  $("screen").innerHTML=`
   <p class="qno">担当者に相談</p>
   <h1>銀行の担当者と話す<br>予約ができます</h1>
   <p class="lead">${has?"ここまでの内容を先に伝えておくので、最初から説明しなくて大丈夫です。":"何から聞けばいいか分からなくても大丈夫です。担当者が一緒に整理します。"}相談は無料です。</p>
   ${has?`<div class="card"><h2 style="font-size:17px;margin-bottom:8px">担当者に伝わる内容</h2>
    <dl class="dl"><dt>気になること</dt><dd>${S.worries.map(id=>wById(id).short).join("、")}</dd><dt>いまの場所</dt><dd>${where}</dd>${t?`<dt>相続税の目安</dt><dd>${t.title}</dd>`:""}<dt>答えた内容</dt><dd>${qList().map(id=>S.ans[id]?Q[id].short+"："+(Array.isArray(S.ans[id])?S.ans[id].join("・"):S.ans[id]):"").filter(Boolean).join("／")||"なし"}</dd><dt>書いたメモ</dt><dd>${memoCount?memoCount+"件":"なし"}</dd></dl></div>`:""}
   ${S.err?`<p class="err" role="alert">${S.err}</p>`:""}
   <p style="font-weight:700">相談の方法を選んでください</p>
   <div class="choice">${[["電話で話す","担当者から電話します"],["お店で話す","近くの店舗で、日時を決めて"],["LINEで聞く","文字で気軽に"]].map(([c,d])=>`<button type="button" class="opt round" aria-pressed="${S.contact===c}" data-c="${c}"><span class="box">●</span><span>${c}<br><span class="small">${d}</span></span></button>`).join("")}</div>
   ${has?`<label class="consent" for="ok"><input type="checkbox" id="ok" ${S.consent?"checked":""}>上の内容を担当者に伝えることに同意します</label>`:""}
   <p class="note">試作品のため、実際の予約は行われません。</p>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.contact=b.dataset.c;S.err="";V.book()});
  if($("ok"))$("ok").onchange=e=>{S.consent=e.target.checked;S.err=""};
  bar([{id:"b",label:backLabel(),cls:"back",on:back},{id:"n",label:"この内容で予約する",cls:"primary",on:()=>{
    if(!S.contact){S.err="相談の方法を1つ選んでください。";V.book();return}
    if(has&&!S.consent){S.err="担当者に伝えてよいか、チェックを入れてください。";V.book();return}
    go("booked")}}]);
},
booked(){
  $("screen").innerHTML=`
   <p class="flash">✓ 予約を受け付けました（試作）</p>
   <h1>担当者から<br>ご連絡します</h1>
   <div class="card"><dl class="dl"><dt>方法</dt><dd>${S.contact}</dd><dt>伝わる内容</dt><dd>${S.worries.length?"気になること・いまの場所・答えた内容・メモ":"なし（担当者が一緒に整理します）"}</dd></dl></div>
   <p class="lead">相談の日まで、道のりとメモはそのまま残ります。</p>`;
  bar([{id:"n",label:S.worries.length?"道のりに戻る":"はじめの画面へ",cls:"primary",on:()=>{S.hist=[];S.screen=S.worries.length?"route":"home";render()}}]);
},
pro(){
  const list=S.proFor&&S.proFor.length?S.proFor:["弁護士","税理士","司法書士"];
  const memoCount=Object.values(S.memos).filter(Boolean).length;
  $("screen").innerHTML=`
   <p class="qno">専門家を探す</p>
   <h1>${list.join("・")}を<br>探せます</h1>
   <p class="lead">そうぞくガイドに掲載している、相続にくわしい専門家の事務所を、お住まいの地域から探せます。</p>
   ${list.map(p=>`<div class="card"><h2 style="font-size:18px">${p}</h2><dl class="dl" style="margin-top:6px"><dt>こんなとき</dt><dd>${PROINFO[p].role}</dd><dt>費用の目安</dt><dd>${PROINFO[p].fee}</dd></dl></div>`).join("")}
   <div class="card"><p style="font-weight:700">相談のときに見せられるもの</p><p class="small">この道のりと${memoCount?`書いたメモ（${memoCount}件）`:"答えた内容"}を、画面で見せながら話せます。銀行の担当者への相談と違い、内容が自動で伝わることはありません。</p></div>
   <p class="note">試作品のため、この先は既存の「専門家をさがす」（都道府県から探す画面）を想定しています。</p>`;
  bar([{id:"b",label:backLabel(),cls:"back",on:back},{id:"n",label:"お住まいの地域から探す",cls:"primary",on:back}]);
},
line(){
  $("screen").innerHTML=`
   <p class="qno">続きをLINEで</p>
   <h1>次の一歩を<br>LINEでお知らせします</h1>
   <div class="card"><dl class="dl"><dt>届く内容</dt><dd>次にやることと、道のりへの入口</dd><dt>頻度</dt><dd>週に1回まで。いつでも止められます</dd></dl></div>
   <p class="note">試作品のため、実際の登録は行われません。</p>`;
  bar([{id:"b",label:backLabel(),cls:"back",on:back},{id:"n",label:"友だち追加する（試作）",cls:"primary",on:back}]);
},
map(){
  $("screen").innerHTML=`
   <p class="qno">確認用</p>
   <h1>画面マップ</h1>
   <div class="card small">この端末の状態：動きを減らす設定 ${RM()?"<b>オン</b>（動きは控えめのフェードのみ）":"オフ"}／${(navigator.userAgent.match(/OS (\d+)_(\d+)/)||[]).length?"iOS "+navigator.userAgent.match(/OS (\d+)_(\d+)/).slice(1).join("."):"iOS以外"}</div>
   <div class="card map"><ol>
    <li>はじめの画面<div class="br">分岐：自分で調べる → 既存のやることリスト（44件・変更なし）</div></li>
    <li>質問のページ（縦に続く1ページ。選んで「次へ」）
      <div class="br">気になること（7択・複数可）→ 選んだものに関係する質問だけを、まとめて聞く（重複は1回）</div>
      <div class="br">最後に「お話を整理しました」：やることの数と、そのうちサイト内で終わる数</div></li>
    <li>あなたの道のり（既存タスクから、当てはまるものだけを並べる。3〜6個、超えた分は下にまとめる）
      <div class="br">種類：読んで終わります／書いて残します／その場で分かります（相続人と相続税の目安）／人に相談します（銀行の担当者か、専門家を探すかを選べる）</div>
      <div class="br">下に「ほかに選んだこと」の道のりも並ぶ</div></li>
    <li>担当者に相談（右上のボタンからはいつでも）</li>
   </ol></div>
   ${WORRIES.map(w=>`<div class="card map"><p style="font-weight:700">${w.label}</p>
     <p class="small">聞く質問：${QOF[w.id].map(id=>Q[id].short+"（"+Q[id].src+"）").join("、")}</p>
     <ol>${ROUTES[w.id].map(s=>`<li>${plain(s.t)} <span class="small">［${KIND[kindOf(s)]}${s.if?"・当てはまる人だけ":""}］${/^\d/.test(s.pd)?" "+s.pd:""}</span></li>`).join("")}</ol></div>`).join("")}`;
  bar([{id:"b",label:backLabel(),cls:"back",on:back}]);
}
};
function render(){(V[S.screen]||V.home)();}
$("askBtn").onclick=()=>{if(S.screen!=="book")go("book")};
render();
</script>

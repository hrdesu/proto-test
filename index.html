<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>寄り添いガイド 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column; one question per screen; the route shows every step's title, the current step is worked in place; results are written into "わたしのエンディングノート" */
:root{
  --bg:#f6f4f7; --card:#ffffff; --fg:#2a2430; --sub:#5d5664; --line:#d9d1de;
  --accent:#9c3f86; --accent-soft:#f6e6f1; --accent-ink:#6e2a5e; --ok:#2f7a5b; --ok-soft:#e4f2ea;
  --paper:#fffdf4; --paper-line:#e8dfb8; --paper-rule:#efe7c8;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18151b; --card:#231f27; --fg:#f1ecf3; --sub:#bdb3c4; --line:#3d3542;
  --accent:#e08ccc; --accent-soft:#3a2535; --accent-ink:#f4c6e8; --ok:#7fd0a8; --ok-soft:#1f3329;
  --paper:#26231a; --paper-line:#4d4628; --paper-rule:#38331f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18151b; --card:#231f27; --fg:#f1ecf3; --sub:#bdb3c4; --line:#3d3542;
  --accent:#e08ccc; --accent-soft:#3a2535; --accent-ink:#f4c6e8; --ok:#7fd0a8; --ok-soft:#1f3329;
  --paper:#26231a; --paper-line:#4d4628; --paper-rule:#38331f; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.75}
[hidden]{display:none!important}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;z-index:2;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center}
.tag{font-family:var(--body);font-size:12px;font-weight:400;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--sub)}
.ask{font:inherit;font-size:14px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border:0;border-radius:12px;padding:6px 12px;min-height:44px;cursor:pointer;line-height:1.3;text-align:center}
.ask small{display:block;font-weight:400;font-size:11px}
.layout{flex:1;display:block}
main{padding-block:20px 48px;display:flex;flex-direction:column;gap:18px;min-width:0}
aside{display:none}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:8px;padding-top:16px;border-top:1px solid var(--line)}
.actions .row{display:flex;gap:10px}
.actions .hint{text-align:left}
@media (min-width:900px){
 .app{max-width:1080px;padding-inline:32px}
 .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
 aside:not(:empty){display:flex;flex-direction:column;gap:14px;position:sticky;top:96px;padding-block:20px}
 .m-only{display:none!important}
 main h1{font-size:30px}
}
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--accent);padding:24px;cursor:pointer}
.ov-card{text-align:center;color:#fff;max-width:520px}
.ov-sub{font-size:18px;opacity:.9}
.ov-main{font-family:var(--display);font-size:32px;line-height:1.4;font-weight:700;text-wrap:balance}
.ov.show{-webkit-animation:ovfade 1.3s ease both;animation:ovfade 1.3s ease both}
@-webkit-keyframes ovfade{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes ovfade{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:no-preference){.ov.show .ov-card{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}}
h1{font-family:var(--display);font-size:26px;line-height:1.45;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:20px;margin:0;line-height:1.5}
p{margin:0}
.lead{color:var(--sub)}
.small{font-size:15px;color:var(--sub)}
.qno{font-size:16px;color:var(--sub);font-weight:700}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--accent)}
.choice{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;text-align:left;width:100%;min-height:60px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);display:flex;gap:12px;align-items:center;cursor:pointer}
.opt .box{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;font-size:15px;color:transparent}
.opt.round .box{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .box{border-color:var(--accent);background:var(--accent);color:var(--card)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.unused-bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:3}
.bar-in{max-width:428px;margin:0 auto;display:flex;gap:10px}
.btn{font:inherit;font-weight:700;min-height:58px;border-radius:14px;padding:0 16px;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--fg);line-height:1.3}
.btn small{display:block;font-size:12px;font-weight:400}
.btn.primary{flex:1;background:var(--accent);border-color:var(--accent);color:var(--card)}
.back-btn{background:transparent}
.btn.wide{width:100%}
.btn.sm{min-height:48px;font-size:16px}
.hint{font-size:13px;color:var(--sub);text-align:center;margin-top:4px}
.err{font-size:15px;color:var(--accent-ink);background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.dl dt{color:var(--sub);font-size:15px}
.dl dd{margin:0;min-width:0}
.link{font:inherit;background:none;border:0;color:var(--accent-ink);text-decoration:underline;padding:6px 0;cursor:pointer;text-align:left;min-height:44px}
.kw{font-weight:700;text-decoration:underline;text-decoration-color:var(--paper-line);text-decoration-thickness:3px;text-underline-offset:3px}
.gloss{background:var(--paper);border:1px solid var(--paper-line);border-radius:10px;padding:8px 12px;font-size:15px}
.gloss b{display:block;font-size:14px;color:var(--sub)}
/* route */
.road{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.road>li{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:12px;position:relative;padding-bottom:16px}
.road>li::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:3px;background:var(--line)}
.road>li:last-child::before{display:none}
.road>li.done::before{background:var(--ok)}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--sub);z-index:1}
.done .dot{border-color:var(--ok);background:var(--ok);color:var(--card)}
.now .dot{border-color:var(--accent);background:var(--accent);color:var(--card);box-shadow:0 0 0 5px var(--accent-soft)}
.st b{display:block;line-height:1.5}
.st .small{display:block}
.now .st>b{color:var(--accent-ink)}
.work{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:16px;margin-top:10px;display:flex;flex-direction:column;gap:14px}
.goes{display:inline-flex;align-items:center;gap:6px;font-size:14px;background:var(--paper);border:1px solid var(--paper-line);border-radius:999px;padding:2px 12px;color:var(--fg);align-self:flex-start}
.done .goes{opacity:.8}
/* writing */
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:700}
textarea{font:inherit;font-size:18px;width:100%;min-height:120px;border:3px solid var(--accent);border-radius:12px;padding:12px;background:var(--paper);color:var(--fg);resize:vertical;line-height:1.8;background-image:linear-gradient(transparent calc(1.8em - 1px),var(--paper-rule) 1px);background-size:100% 1.8em;background-position:0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:16px;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 14px;min-height:44px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.result{background:var(--paper);border:2px solid var(--paper-line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.big{font-family:var(--display);font-size:22px;line-height:1.4}
.flash{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:700;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.undo{font:inherit;font-size:14px;font-weight:400;background:none;border:0;color:var(--ok);text-decoration:underline;padding:0;min-height:36px;cursor:pointer}
/* note */
.notecard{background:var(--paper);border:1px solid var(--paper-line);border-radius:6px 16px 16px 6px;border-left:10px solid var(--accent);padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.notecard .pages{font-family:var(--display);font-size:22px}
.page{background:var(--paper);border:1px solid var(--paper-line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.page h2{font-size:18px;border-bottom:2px solid var(--paper-line);padding-bottom:4px}
.page.empty{opacity:.7}
.entry{white-space:pre-wrap;word-break:break-word}
.entry b{display:block;font-size:14px;color:var(--sub);font-weight:400}
.bigmode{display:flex;flex-direction:column;gap:18px;font-size:21px}
.bigmode h1{font-size:30px}
.talk{border:2px solid var(--accent)}
.talkq{font-family:var(--display);font-size:24px;line-height:1.5}
.talkbox{border:2px dashed var(--accent)}
.talklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:16px}
.tag.ask,.tag.tell{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:1px}
.tag.ask{background:var(--accent-soft);color:var(--accent-ink)}
.tag.tell{background:var(--ok-soft);color:var(--ok)}
.work.later{border-style:dashed;border-color:var(--line);background:var(--bg)}
.crumb{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15px}
.agenda{margin:0;padding-left:1.3em}
.agenda li{margin:4px 0}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.consent input{width:26px;height:26px;margin-top:2px;accent-color:var(--accent);flex:none}
.note{font-size:13px;color:var(--sub);border-top:1px dashed var(--line);padding-top:12px}
.map{font-size:15px;line-height:1.7}
.map ol{margin:0;padding-left:1.3em}
.inline-confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:15px}
main{-webkit-animation:fade .45s ease-out both;animation:fade .45s ease-out both}
.flash{-webkit-animation:fade .5s ease-out both;animation:fade .5s ease-out both}
@-webkit-keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){main{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">相続準備ガイド <span class="tag">試作品</span></div>
    <button class="ask" id="askBtn" type="button">銀行に相談<small>無料・電話/お店/LINE</small></button>
  </header>
  <div class="layout"><main id="screen"></main><aside id="aside" aria-label="いまの状況"></aside></div>
</div>
<div class="ov" id="ov" hidden role="status" aria-live="assertive"><div class="ov-card"><p class="ov-sub" id="ovSub"></p><p class="ov-main" id="ovMain"></p></div></div>

<script>
const GLOSS={
 "支店名":"通帳の表紙や1ページ目に書いてある「◯◯支店」のことです。",
 "権利証":"家や土地の持ち主であることを示す書類です。「登記識別情報」と書かれた紙の場合もあります。",
 "法定相続人":"法律で決まっている、財産を受け継ぐ人です。夫・妻と、子ども（子どもがいなければ親や兄弟）がなります。",
 "基礎控除":"相続税がかからない金額の上限です。3,000万円＋600万円×法定相続人の数で計算します。",
 "相続税":"亡くなった人の財産を受け取ったときにかかる税金です。財産が基礎控除より少なければかかりません。",
 "暦年贈与":"1年間（1月〜12月）に110万円までの贈与なら、贈与税がかからない仕組みです。",
 "二次相続":"夫・妻のどちらかが亡くなった後、残った人が亡くなったときの相続です。",
 "成年後見":"判断が難しくなった人のお金や契約を、家庭裁判所が選んだ人が代わりに管理する仕組みです。",
 "家族信託":"元気なうちに、信頼できる家族にお金や家の管理を任せる契約です。"
};
/* ending-note pages: the container every step's result is written into */
const PAGES=[["family","家族のこと"],["money","お金のこと"],["tax","相続税のこと"],["land","家や土地のこと"],["leave","残したいもの"],["care","医療・介護のこと"],["words","家族へのことば"],["things","身の回りのこと"]];
const WORRIES=[
 {id:"where",label:"通帳や保険がどこにあるか、家族が知らない",short:"お金の置き場所を家族が知らない",agenda:"財産の一覧に、漏れがないかの確認"},
 {id:"tax",label:"相続税がかかるか分からない",short:"相続税がかかるか分からない",agenda:"相続税の正確な試算と、今からできる対策"},
 {id:"leave",label:"子どもに何を残せばいいか分からない",short:"何を残すか決められない",agenda:"遺言の作り方と、生きているうちに渡す方法"},
 {id:"dementia",label:"認知症になったら、お金はどうなるか心配",short:"判断が難しくなった後が心配",agenda:"家族が代わりにお金を出せる仕組み（信託など）"},
 {id:"talk",label:"家族で話したことがない",short:"家族とまだ話せていない",agenda:"家族に何を伝えておくとよいか"},
 {id:"tidy",label:"家や物の片付けが手つかず",short:"片付けが手つかず",agenda:"片付けや、お墓のことの相談先"},
 {id:"land",label:"家や土地をどうするか決めていない",short:"家や土地をどうするか決めていない",agenda:"家や土地の名義と、引き継ぎ方"}
];
const Q={
 spouse:{q:"夫・妻はいらっしゃいますか？",short:"夫・妻",a:["いる","いない","わからない"]},
 kids:{q:"お子さんは何人いますか？",short:"お子さん",a:["0人","1人","2人","3人以上","わからない"]},
 sibs:{q:"ご兄弟は何人いますか？",short:"ご兄弟",a:["0人","1人","2人","3人以上","わからない"],if:A=>A.kids==="0人"},
 assets:{q:"預金や株などは、全部でどのくらいですか？",short:"預金や株",a:["1,000万円未満","1,000万〜3,000万円","3,000万〜1億円","1億円以上","わからない"]},
 land:{q:"家や土地をお持ちですか？",short:"家や土地",a:["持っている","持っていない","わからない"]},
 debt:{q:"ローンや、借りているお金はありますか？",short:"借りているお金",a:["ある","ない","わからない"]},
 others:{q:"家族以外に、財産を渡したい人はいますか？",short:"家族以外に渡したい人",a:["いる","いない","わからない"]},
 will:{q:"遺言書を作ったことはありますか？",short:"遺言書",a:["ある","ない","わからない"]},
 care:{q:"いま、介護を受けていますか？",short:"介護",a:["受けている","受けていない"]},
 pet:{q:"ペットを飼っていますか？",short:"ペット",a:["飼っている","飼っていない"]},
 grave:{q:"お墓のことで、決めていないことはありますか？",short:"お墓",a:["ある","ない","わからない"]},
 landtype:{q:"お持ちのものを、すべて選んでください",short:"持っている家や土地",a:["自宅","空き家・別荘","貸している土地や建物","山林・農地","親の名義のままの土地","わからない"],multi:true}
};
const QOF={where:["land","debt"],tax:["spouse","kids","sibs","assets","land"],leave:["spouse","kids","sibs","others","will"],dementia:["care"],talk:["kids"],tidy:["pet","grave"],land:["landtype"]};
/* step kinds: write (書いてノートに残す) / decide (読んで、決めたことを残す) / calc (その場で分かり、ノートに残る) / human (人に相談する) */
const ROUTES={
 where:[
  {id:"0001",t:"よく使う通帳の、銀行名と置き場所を書く",k:"write",page:"money",bring:"通帳",time:"5分",chips:["タンスの引き出し","金庫","仏壇の下","寝室の棚"],ph:"例：◯◯銀行 △△支店。タンスの上の引き出し"},
  {id:"0002",t:"株や投資信託の、会社名と書類の置き場所を書く",k:"write",page:"money",bring:"証券会社からの書類",time:"5分",chips:["持っていない","本棚のファイル","金庫"],ph:"例：□□証券。書類は本棚の青いファイル"},
  {id:"0004",t:"借りているお金を書く",k:"write",page:"money",bring:"ローンの書類",time:"5分",chips:["住宅ローン","車のローン","カードの分割払い"],ph:"例：住宅ローン △△銀行 残り300万円くらい",if:A=>A.debt!=="ない"},
  {id:"0003",t:"家や土地の[[権利証]]の置き場所を書く",k:"write",page:"land",bring:"[[権利証]]",time:"5分",chips:["金庫","仏壇の引き出し","銀行の貸金庫","わからない"],ph:"例：権利証は金庫の中",if:A=>A.land==="持っている"},
  {id:"0007",t:"銀行の相談員に、漏れがないか見てもらう",k:"human",time:"30分",pro:["税理士"]}],
 tax:[
  {id:"0005",t:"[[法定相続人]]が誰になるかを確かめる",k:"calc",tool:"heirs",page:"family",time:"1分"},
  {id:"0006",t:"[[相続税]]がかかるかの目安を見る",k:"calc",tool:"tax",page:"tax",time:"1分"},
  {id:"0021",t:"相続税を預金で払えそうか考える",k:"decide",page:"tax",time:"3分",about:"相続税は、原則として10か月以内に現金で払います。家や土地が多く預金が少ないと、払うお金が足りなくなることがあります。",ask:"預金で払えそうですか？",opts:["払えそう","足りないかもしれない","わからない"],if:A=>taxResult(A).level!=="safe"},
  {id:"0034",t:"生きているうちに少しずつ渡すか考える",k:"decide",page:"leave",time:"3分",about:"1年に110万円までなら、贈与税がかからずに渡せます（[[暦年贈与]]）。亡くなる前7年以内の分は相続財産に戻されます。",ask:"生きているうちに渡したいですか？",opts:["渡したい","今は考えていない","わからない"],if:A=>taxResult(A).level!=="safe"},
  {id:"0009",t:"銀行の相談員と、正確な試算をする",k:"human",time:"30分",pro:["税理士"],if:A=>taxResult(A).level!=="safe"}],
 leave:[
  {id:"0005",t:"[[法定相続人]]が誰になるかを確かめる",k:"calc",tool:"heirs",page:"family",time:"1分"},

   <p class="lead">${filledPages()}ページ書き込んだノートを、家族に届けられます。次に会ったとき、続きを一緒に書くきっかけにもなります。</p>
   <div class="choice">

    <button type="button" class="opt round" aria-pressed="${S.sendBy==="print"}" data-s="print"><span class="box">●</span><span>紙に印刷する<br><span class="small">家のプリンターや、銀行の窓口で印刷できます</span></span></button>
    <button type="button" class="opt round" aria-pressed="${S.sendBy==="app"}" data-s="app"><span class="box">●</span><span>わが家ノート（三菱UFJ信託銀行のアプリ）に移す<br><span class="small">家族に見せるタイミングを選んで残せます</span></span></button>
   </div>
   ${S.err?`<p class="err" role="alert">${S.err}</p>`:""}
   <p class="note">試作品のため、実際の送信・印刷は行われません。</p>`;

book(){
  const has=S.worries.length>0;const ag=has?agenda():[];
  $("screen").innerHTML=`
   <p class="qno">銀行に相談</p>
   <h1>銀行の相談員と話す<br>予約ができます</h1>
   <p class="lead">相続にくわしい銀行の相談員が、電話・お店・LINEでお話を聞きます。相談は無料です。${has?"話すことは、ここで用意しておきます。":"何から聞けばいいか分からなくても大丈夫です。相談員が一緒に整理します。"}</p>
   ${has?`<div class="card"><h2 style="font-size:18px">相談員と話すこと</h2><ol class="agenda">${ag.map(a=>`<li>${esc(a)}</li>`).join("")}</ol>
   <p class="small">エンディングノート（${filledPages()}ページ）も見せながら話せます。最初から説明しなくて大丈夫です。</p></div>`:""}
   ${S.err?`<p class="err" role="alert">${S.err}</p>`:""}
   <p style="font-weight:700">相談の方法を選んでください</p>
   <div class="choice">${[["電話で話す","相談員から電話します"],["お店で話す","近くの店舗で、日時を決めて"],["LINEで聞く","文字で気軽に"]].map(([c,d])=>`<button type="button" class="opt round" aria-pressed="${S.contact===c}" data-c="${c}"><span class="box">●</span><span>${c}<br><span class="small">${d}</span></span></button>`).join("")}</div>
   ${has?`<label class="consent" for="ok"><input type="checkbox" id="ok" ${S.consent?"checked":""}>話すことと、ノートを相談員に伝えることに同意します</label>`:""}
   <p class="note">試作品のため、実際の予約は行われません。</p>`;
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{S.contact=b.dataset.c;S.err="";V.book()});
  if($("ok"))$("ok").onchange=e=>{S.consent=e.target.checked;S.err=""};
  bar([{id:"b",label:backLabel(),cls:"back",on:back},{id:"n",label:"この内容で予約する",cls:"primary",on:()=>{
    if(!S.contact){S.err="相談の方法を1つ選んでください。";V.book();return}
    if(has&&!S.consent){S.err="相談員に伝えてよいか、チェックを入れてください。";V.book();return}
    const r=has?routeOf(S.worries[0]):[];const hs=r.find(s=>s.k==="human"&&!S.done[s.id]);
    if(hs){S.done[hs.id]=true;S.lastDone=null;S.flash="相談の予約を受け付けました（試作）。相談員からご連絡します"}
    persist();show(has?"route":"home")}}]);
},
pro(){
  const list=S.proFor&&S.proFor.length?S.proFor:["弁護士","税理士","司法書士"];
  $("screen").innerHTML=`
   <p class="qno">専門家を探す</p>
   <h1>${list.join("・")}を<br>探せます</h1>
   <p class="lead">そうぞくガイドに掲載している、相続にくわしい事務所を、お住まいの地域から探せます。</p>
   ${list.map(p=>`<div class="card"><h2 style="font-size:18px">${p}</h2><dl class="dl"><dt>こんなとき</dt><dd>${PROINFO[p].role}</dd><dt>費用の目安</dt><dd>${PROINFO[p].fee}</dd></dl></div>`).join("")}
   <div class="card"><p style="font-weight:700">相談のときに見せられるもの</p><p class="small">エンディングノートを画面や紙で見せながら話せます。</p></div>
   <p class="note">試作品のため、この先は既存の「専門家をさがす」（都道府県から探す画面）を想定しています。</p>`;
  bar([{id:"b",label:backLabel(),cls:"back",on:back},{id:"n",label:"お住まいの地域から探す",cls:"primary",on:back}]);
},
map(){
  const rm=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;const ios=navigator.userAgent.match(/OS (\d+)_(\d+)/);
  $("screen").innerHTML=`
   <p class="qno">確認用</p><h1>画面マップ</h1>
   <div class="card small">この端末：動きを減らす設定 ${rm?"オン":"オフ"}／${ios?"iOS "+ios.slice(1).join("."):"iOS以外"}</div>
   <div class="card map"><ol>
    <li>はじめの画面（続きがあれば「続きから始める」）</li>
    <li>質問（1画面に1問。「次へ」で画面が切り替わる。「戻る」で前の質問へ）：気になること → 選んだものに関係する質問だけ</li>
    <li>整理：やることの数、最初の一歩、ノートのどのページに書き込まれるか</li>
    <li>やること：一人でやること → 家族がそろう日に、ノートを開いて話す（一人でやることを終えたら日を決める。決める画面の上には「やること ＞ 家族がそろう日」と「やることに戻る」を常に表示）→ 必要なら家族で相談（銀行・専門家）。一人で決められなかった答えや書かずに進んだ一歩は「家族と話すこと（一緒に考えたい）」に、書いたことは「家族と話すこと（伝えたい）」にたまる。いまのステップだけ、その場で作業する
      <br>種類：書いてノートに残す／読んで、決めたことを残す／その場で分かる／人に相談する</li>
    <li>エンディングノート：8ページ。終えたステップの結果が書き込まれる → 家族に渡す（LINE・印刷・わが家ノート）</li>
    <li>家族がそろう日を決める（1画面1問）：集まり → 時期 → 誰と → 話したいこと（3つまで）→（家族旅行のみ）行き先 → 部屋 → 計画。家族旅行は「旅行の予約サービス（提携・架空）」に引き継ぎシートを渡す（ノートの中身は渡さない）。家族をLINEで誘う文面を用意</li>
    <li>家族と一緒に開く（旅行・帰省のとき）：文字を大きく、空いているページに合わせた「家族で話してみること」3つ。話したことをノートに書ける → 家族で銀行に相談</li>
    <li>人に相談する：銀行の相談員（話すことを用意して予約）または専門家を探す</li>
   </ol></div>
   ${WORRIES.map(w=>`<div class="card map"><p style="font-weight:700">${w.label}</p><p class="small">質問：${QOF[w.id].map(id=>Q[id].short).join("、")}</p><ol>${ROUTES[w.id].map(s=>`<li>${plain(s.t)} <span class="small">［${KIND[s.k]}${s.page?"→ノート「"+pageName(s.page)+"」":""}${s.if?"・当てはまる人だけ":""}］</span></li>`).join("")}</ol></div>`).join("")}`;
  bar([{id:"b",label:backLabel(),cls:"back",on:back}]);

};
/* the current step is worked in place */
function work(s){
  const g=glossBlock(s.t,s.bring,s.about);
  if(s.k==="write"){const d=S.draft[s.id]||"";
    return `<div class="work">
      ${s.bring?`<p><b>用意するもの：</b>${rich(s.bring)}</p>`:""}${g}
      <div class="field"><label for="ta">ここに書きます（文字を打つか、下の言葉を押してください）</label>
       <div class="chips">${(s.chips||[]).map(c=>`<button type="button" class="chip" data-chip="${esc(c)}">${esc(c)}</button>`).join("")}</div>
       <textarea id="ta" placeholder="${esc(s.ph)}">${esc(d)}</textarea></div>
      ${S.err?`<p class="err" role="alert">${S.err}</p>`:""}
      <button type="button" class="btn primary wide" id="doWrite">ノートに書く<small>「${pageName(s.page)}」のページに書き込まれます</small></button>
      <button type="button" class="link" id="skip">今は書かずに、次へ進む</button></div>`}
  if(s.k==="decide"){return `<div class="work"><p>${rich(s.about)}</p>${g}
      <p style="font-weight:700">${esc(s.ask)}</p>
      <div class="choice">${s.opts.map(o=>`<button type="button" class="opt round" aria-pressed="${S.pick[s.id]===o}" data-pick="${esc(o)}"><span class="box">●</span><span>${esc(o)}</span></button>`).join("")}</div>
      ${S.err?`<p class="err" role="alert">${S.err}</p>`:""}
      <button type="button" class="btn primary wide" id="doDecide">ノートに書く<small>「${pageName(s.page)}」のページに書き込まれます</small></button></div>`}
  if(s.k==="calc"){const t=s.tool==="tax"?taxResult(S.ans):null;
    return `<div class="work">${g}<div class="result"><p class="small">答えていただいた内容から</p><p class="big">${s.tool==="heirs"?esc(toolText(s).split("（")[0]):esc(t.title)}</p><p>${s.tool==="heirs"?esc((toolText(s).match(/（(.+)）/)||[,""])[1]):esc(t.body)}</p>${s.tool==="tax"?`<p class="small">あくまで目安です。自宅の土地は評価が大きく下がる特例があるなど、実際とずれる場合があります。</p>`:""}</div>
      <button type="button" class="btn primary wide" id="doCalc">ノートに書く<small>「${pageName(s.page)}」のページに書き込まれます</small></button></div>`}
  return `<div class="work"><p>ここから先は、人と一緒に進めると安心です。相談する相手を選べます。</p>
      <button type="button" class="btn primary wide" id="doBook">銀行の相談員に相談する<small>無料・話すことを用意して予約</small></button>
      ${s.pro&&s.pro.length?`<button type="button" class="btn wide" id="doPro">${s.pro.join("・")}を探す<small>そうぞくガイドの専門家さがし</small></button>`:""}
      <button type="button" class="link" id="skip">もう相談したので、次へ進む</button></div>`;
}
function finish(s,text){S.done[s.id]=true;const lb=noteLabel(s);if(s.page&&text!=null)S.notes[s.id]={page:s.page,label:lb,text};
  let tk=null;
  if(s.k==="write"&&text)tk={kind:"tell",text:`${lb}：${text}`};
  if(s.k!=="human"&&text==null)tk={kind:"ask",text:`${lb}を、まだ決められていない`};
  if(s.k==="decide"){const v=S.pick[s.id];tk={kind:UNSURE.test(v)?"ask":"tell",text:`${lb}：${v}`}}
  if(s.tool==="heirs"){const h=heirs(S.ans);tk=h.n?{kind:"tell",text:`相続人になるのは ${h.who}`}:{kind:"ask",text:"相続人が誰になるか、まだ分からない"}}
  if(s.tool==="tax"){const t=taxResult(S.ans);tk=t.level==="safe"?{kind:"tell",text:"相続税は、かからなそう"}:t.level==="unknown"?{kind:"ask",text:"相続税の目安が出せなかった。財産のことを一緒に確かめたい"}:{kind:"ask",text:"相続税がかかるかもしれない。どう備えるか"}}
  if(tk){tk.page=s.page||"words";S.talk[s.id]=tk}
  S.lastDone=s.id;S.flash=(s.page&&text!=null?`ノートの「${pageName(s.page)}」に書きました`:`「${plain(s.t)}」を終えました`)+(tk?"。家族と話すことにも加えました":"");S.err="";delete S.draft[s.id];persist();render();window.scrollTo(0,0);cue(s.page&&text!=null?`ノートの「${pageName(s.page)}」に書きました`:"次のやることに進みます",s.page&&text!=null?"書けました":"")}
function bindWork(all,cur){
  const s=all[cur];if(!s)return;
  const ta=$("ta");
  if(ta)ta.oninput=()=>{S.draft[s.id]=ta.value;persist()};
  document.querySelectorAll("[data-chip]").forEach(b=>b.onclick=()=>{const v=b.dataset.chip;ta.value=ta.value?ta.value+"、"+v:v;S.draft[s.id]=ta.value;persist();ta.focus()});
  if($("doWrite"))$("doWrite").onclick=()=>{const v=(ta.value||"").trim();if(!v){S.err="ひとことでも書くか、上の言葉を押してください。書かずに進むこともできます。";V.route();return}finish(s,v)};
  if($("doDecide"))$("doDecide").onclick=()=>{const v=S.pick[s.id];if(!v){S.err="1つ選んでください。";V.route();return}finish(s,`${s.ask} → ${v}`)};
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{S.pick[s.id]=b.dataset.pick;S.err="";V.route()});
  if($("doCalc"))$("doCalc").onclick=()=>finish(s,toolText(s));
  if($("doBook"))$("doBook").onclick=()=>show("book");
  if($("doPro"))$("doPro").onclick=()=>{S.proFor=s.pro;show("pro")};
  if($("skip"))$("skip").onclick=()=>finish(s,null);
}
function sideFor(name){
  const notePrev=()=>`<div class="notecard"><div><p style="font-weight:700">わたしのエンディングノート</p><p class="small">${filledPages()} / ${PAGES.length}ページ</p></div></div>
    <div class="page">${PAGES.map(([p,n])=>{const c=Object.values(S.notes).filter(x=>x.page===p).length;return `<p class="${c?"":"small"}">${c?"✓ ":"・"}${n}${c?`（${c}）`:""}</p>`}).join("")}</div>`;
  if(name==="q"){const qs=qList();const rows=[];if(S.worries.length)rows.push(`<p><span class="small">気になること</span><br>${S.worries.map(w=>wById(w).short).join("、")}</p>`);
    qs.forEach((id,i)=>{if(i<S.qi-1&&S.ans[id])rows.push(`<p><span class="small">${Q[id].short}</span><br>${Array.isArray(S.ans[id])?S.ans[id].join("・"):S.ans[id]}</p>`)});
    return `<div class="card"><h2 style="font-size:17px">これまでの答え</h2>${rows.join("")||'<p class="small">まだありません</p>'}<p class="small">「戻る」で前の質問に戻って、選び直せます。</p></div>`}
  if(name==="together")return notePrev();
  if(name==="summary"||name==="route"||name==="send")return notePrev()+(name==="route"?`<div class="card"><p style="font-weight:700">迷ったら、銀行に相談</p><p class="small">相続にくわしい相談員が、無料でお話を聞きます。</p><button type="button" class="btn wide" id="sideBook">銀行に相談する</button></div><div class="card"><p style="font-weight:700">家族がそろうときに</p><p class="small">${planDone()?planTitle()+"に、ノートを一緒に開きます。":"家族旅行や帰省の日を決めて、ノートを一緒に開けます。"}</p><button type="button" class="btn wide" id="sideTogether">家族と一緒に開く</button></div>`:"");
  if(name==="book")return `<div class="card"><h2 style="font-size:17px">予約のあと</h2><p class="small">相談員から、選んだ方法でご連絡します。ノートと話すことは、相談の日まで残ります。</p></div>`;
  return "";
}
const SUBFLOW={gather:"家族がそろう日を決める",plan:"家族がそろう日の計画",handoff:"旅行の予約に引き継ぐ",invite:"家族を誘う"};
function crumb(){if(!SUBFLOW[S.screen]||!S.worries.length)return;$("screen").insertAdjacentHTML("afterbegin",`<nav class="crumb" aria-label="いまいる場所"><span>やること ＞ <b>${SUBFLOW[S.screen]}</b></span><button type="button" class="btn sm" id="crumbBack">やることに戻る</button></nav>`);$("crumbBack").onclick=()=>show("route")}
function render(){side("");(V[S.screen]||V.home)();crumb();side(sideFor(S.screen));if($("sideBook"))$("sideBook").onclick=()=>show("book");if($("sideTogether"))$("sideTogether").onclick=()=>show("together");}
$("ov").onclick=()=>{$("ov").hidden=true};
$("askBtn").onclick=()=>{if(S.screen!=="book")show("book")};
render();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>相続準備ガイド 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* v22: information design rebuilt after the Digital Agency design system (one purpose per screen, 1 filled button, short text, one progress component) */
:root{
  /* colors sampled from the existing そうぞくガイド: page #fcf8fb, headings #653257, accent #aa5194, label #eedcea, text #313131 */
  --bg:#fcf8fb; --card:#ffffff; --fg:#313131; --sub:#5f5a5e; --line:#dccdd8; --line-soft:#eedcea;
  --accent:#aa5194; --accent-soft:#f6eaf3; --accent-ink:#653257; --ok:#2b7656; --ok-soft:#e3f1e9;
  --paper:#fffdf5; --paper-line:#e6dcb4; --paper-rule:#efe7c8;
  --display:"Noto Sans JP","Hiragino Sans","BIZ UDPGothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","BIZ UDPGothic","Yu Gothic",Meiryo,sans-serif;
  --s1:8px; --s2:16px; --s3:24px; --s4:40px; --s5:64px; --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17141a; --card:#221e26; --fg:#f2edf4; --sub:#bdb3c5; --line:#4a4150; --line-soft:#332d38;
  --accent:#e08ccc; --accent-soft:#3a2535; --accent-ink:#f4c6e8; --ok:#7fd0a8; --ok-soft:#1f3329;
  --paper:#26231a; --paper-line:#4d4628; --paper-rule:#38331f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17141a; --card:#221e26; --fg:#f2edf4; --sub:#bdb3c5; --line:#4a4150; --line-soft:#332d38;
  --accent:#e08ccc; --accent-soft:#3a2535; --accent-ink:#f4c6e8; --ok:#7fd0a8; --ok-soft:#1f3329;
  --paper:#26231a; --paper-line:#4d4628; --paper-rule:#38331f; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.7;letter-spacing:.02em}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px}
/* header: the only always-present place for note and consult */
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;align-items:center;gap:var(--s1);padding-block:var(--s1);z-index:2;border-bottom:1px solid var(--line)}
.brand{font:inherit;font-family:var(--display);font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:flex-start;margin-right:auto;line-height:1.3;background:none;border:0;padding:4px 0;color:var(--fg);cursor:pointer;min-height:44px;text-align:left}
.brand small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px}
.tag{font-family:var(--body);font-size:12px;font-weight:400;border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--sub)}
.util{font:inherit;font-size:15px;font-weight:700;color:var(--accent-ink);background:transparent;border:1px solid var(--line);border-radius:var(--r);padding:4px 10px;min-height:44px;cursor:pointer;line-height:1.2}
.util.strong{background:var(--accent-soft);border-color:var(--accent-soft)}
.util b{font-weight:700}
.layout{flex:1;display:block}
main{padding-block:var(--s3) var(--s5);display:flex;flex-direction:column;gap:var(--s3);min-width:0}
aside{display:none}
@media (min-width:900px){
 .app{max-width:1080px;padding-inline:32px}
 .layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s4);align-items:start}
 aside:not(:empty){display:flex;flex-direction:column;gap:var(--s2);position:sticky;top:88px;padding-block:var(--s3)}
 body.wide .layout{grid-template-columns:minmax(0,1fr)}
 body.narrow main{max-width:640px}
}
/* type */
h1{font-family:var(--display);color:var(--accent-ink);font-weight:700;font-size:28px;line-height:1.45;margin:0;text-wrap:balance;word-break:auto-phrase;letter-spacing:.01em}
h2{font-family:var(--display);color:var(--accent-ink);font-weight:700;font-size:22px;margin:0;line-height:1.5}
h3{font-size:18px;margin:0;line-height:1.5}
p{margin:0}
.lead{color:var(--sub)}
.small{font-size:15px;color:var(--sub);line-height:1.6}
.eyebrow{align-self:flex-start;font-size:14px;color:var(--accent);font-weight:700;border:1.5px solid var(--accent);border-radius:999px;padding:1px 12px;background:var(--card);margin-bottom:calc(var(--s2) * -1)}
.stack{display:flex;flex-direction:column;gap:var(--s2)}
.stack.tight{gap:var(--s1)}
/* buttons (filled / outline / text) */
.btn{font:inherit;font-weight:700;min-height:56px;border-radius:var(--r);padding:8px 20px;cursor:pointer;border:2px solid var(--accent);background:var(--card);color:var(--accent-ink);line-height:1.3;letter-spacing:.02em}
.btn small{display:block;font-size:13px;font-weight:400;margin-top:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.wide{width:100%}
.btn.sm{min-height:44px;font-size:16px;padding:4px 14px}
.tbtn{font:inherit;background:none;border:0;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;padding:8px 0;cursor:pointer;text-align:left;min-height:44px}
.actions{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s2)}
@media (min-width:900px){.actions{max-width:480px}}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #f7a600;outline-offset:2px}
/* step navigation (one component for phases and steps) */
.stepnav{list-style:none;margin:0;padding:0;display:flex;gap:4px;counter-reset:s}
.stepnav li{flex:1;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.4;color:var(--sub);min-width:0}
.stepnav li::before{content:"";display:block;height:6px;border-radius:3px;background:var(--line-soft)}
.stepnav li.done::before{background:var(--ok)}
.stepnav li.now::before{background:var(--accent)}
.stepnav li.now{color:var(--fg);font-weight:700}
.stepnav .n{font-weight:700}
.stepnav li.done .n::after{content:" ✓";color:var(--ok)}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line-soft)}
.prog i.on{background:var(--accent)}
.count{font-size:15px;color:var(--sub);font-weight:700}
/* choices */
.choice{display:flex;flex-direction:column;gap:var(--s1)}
.opt{font:inherit;text-align:left;width:100%;min-height:56px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--fg);display:flex;gap:12px;align-items:center;cursor:pointer}
.opt .box{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:14px;color:transparent}
.opt.round .box{border-radius:50%}
.opt[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);padding:11px 15px}
.opt[aria-pressed="true"] .box{border-color:var(--accent);background:var(--accent);color:var(--card)}
.opt .small{display:block}
.err{font-size:16px;color:#b3261e;background:#fdecea;border-left:4px solid #b3261e;border-radius:4px;padding:8px 12px}
@media (prefers-color-scheme:dark){.err{background:#3a1d1b;color:#ffb4ab;border-color:#ffb4ab}}
/* notice block: terms & examples, kept apart from the body text */
.notice{border-left:4px solid var(--paper-line);background:var(--paper);border-radius:4px;padding:var(--s1) var(--s2);font-size:16px}
.notice b{display:block;font-size:14px;color:var(--sub)}
/* success banner */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;background:var(--ok-soft);color:var(--ok);border-left:4px solid var(--ok);border-radius:4px;padding:10px 14px;font-weight:700;font-size:16px}
.banner .tbtn{color:var(--ok);font-weight:400;font-size:15px;min-height:32px;padding:0}
/* description list */
.dl{display:grid;grid-template-columns:auto 1fr;gap:var(--s1) var(--s2);margin:0}
.dl dt{color:var(--sub);font-size:15px}
.dl dd{margin:0;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2) var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.divider{border:0;border-top:1px solid var(--line);margin:0}
/* route */
.howto{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s3)}
.howto .st{display:flex;flex-direction:column;gap:4px}
.road{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.road>li{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:12px;position:relative;padding-bottom:var(--s2)}
.road>li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.road>li:last-child::before{display:none}
.road>li.done::before{background:var(--ok)}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--sub);z-index:1}
.done .dot{border-color:var(--ok);background:var(--ok);color:var(--card)}
.now .dot{border-color:var(--accent);background:var(--accent);color:var(--card)}
.st{display:flex;flex-direction:column;gap:4px;min-width:0}
.st .t{line-height:1.5;padding-top:1px}
.done .st .t{color:var(--sub)}
.rowbtn{all:unset;display:block;width:100%;cursor:pointer;border-radius:4px}
.rowbtn:hover .t,.rowbtn:focus-visible .t{text-decoration:underline}
.rowbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pill{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:0 8px;line-height:1.7;vertical-align:1px}
.pill.now{background:var(--accent);color:var(--card)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.later{border:1px solid var(--line);color:var(--sub)}
.work{background:var(--card);border:2px solid var(--accent);border-radius:var(--r);padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.work h2{font-size:22px}
.workhead{background:var(--accent-soft);margin:calc(var(--s3) * -1) calc(var(--s3) * -1) 0;padding:var(--s2) var(--s3);border-radius:6px 6px 0 0;display:flex;flex-direction:column;gap:4px}
.workhead .count{color:var(--accent-ink)}
.workhead h2{font-size:24px;line-height:1.45}
/* writing */
.field{display:flex;flex-direction:column;gap:var(--s1)}
.field label{font-weight:700}
textarea,.input{font:inherit;font-size:18px;width:100%;border:2px solid var(--fg);border-radius:var(--r);padding:12px;background:var(--card);color:var(--fg);line-height:1.7}
textarea{min-height:112px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:var(--s1)}
.chip{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:4px 14px;min-height:44px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.result{display:flex;flex-direction:column;gap:4px}
.big{font-family:var(--display);font-size:24px;line-height:1.4}
/* horizontal cards (PC A) */
.hwrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s1);align-items:start}
.hwrap>.btn{margin-top:var(--s4)}
.hscroll{display:flex;gap:var(--s2);overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-left:10%;padding:4px 2px var(--s2);align-items:flex-start}
.hcard{flex:none;width:72%;max-width:820px;min-width:240px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2);display:flex;flex-direction:column;gap:var(--s1)}
.hcard{padding:var(--s3)}
.hcard.now{border:2px solid var(--accent)}
.hcard.later{opacity:.75}
.hcard .work{border:0;padding:0;margin:0}
.overview{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:var(--s1)}
.overview li{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.4;color:var(--sub)}
.overview li::before{content:"";height:6px;border-radius:3px;background:var(--line-soft)}
.overview li.done::before{background:var(--ok)}
.overview li.now::before{background:var(--accent)}
.overview li.now{color:var(--fg);font-weight:700}
.nowbox{background:var(--card);border:2px solid var(--accent);border-radius:var(--r);padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.nowbox .work{border:0;padding:0;margin:0}
.seg{display:flex;gap:var(--s1);align-items:center;flex-wrap:wrap;font-size:14px;color:var(--sub);border-top:1px dashed var(--line);padding-top:var(--s2)}
.seg .chip{font-size:14px;min-height:36px}
/* phase done */
.phasedone{display:flex;flex-direction:column;gap:var(--s3);padding-top:var(--s3)}
.check{width:72px;height:72px;border-radius:50%;background:var(--ok);color:var(--card);display:grid;place-items:center;font-size:40px;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2)}
.stat b{display:block;font-family:var(--display);font-size:32px;line-height:1.2}
/* note */
.page{background:var(--paper);border:1px solid var(--paper-line);border-radius:var(--r);padding:var(--s2);display:flex;flex-direction:column;gap:var(--s1)}
.page h2{font-size:18px}
.page.empty{background:transparent;border-style:dashed}
.entry{white-space:pre-wrap;word-break:break-word}
.entry b{display:block;font-size:14px;color:var(--sub);font-weight:400}
.talklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s1)}
.talklist li{display:flex;gap:8px;align-items:baseline}
.tag.ask,.tag.tell{flex:none;display:inline-block;font-size:12px;border:0;border-radius:999px;padding:1px 8px;font-weight:700}
.tag.ask{background:var(--accent-soft);color:var(--accent-ink)}
.tag.tell{background:var(--ok-soft);color:var(--ok)}
.bigmode{display:flex;flex-direction:column;gap:var(--s3);font-size:21px}
.bigmode h1{font-size:32px}
.talkq{font-family:var(--display);font-size:24px;line-height:1.5}
.crumb{display:flex;justify-content:space-between;align-items:center;gap:var(--s1);flex-wrap:wrap;font-size:15px;color:var(--sub)}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.consent input{width:26px;height:26px;margin-top:2px;accent-color:var(--accent);flex:none}
.note{font-size:14px;color:var(--sub)}
.map{font-size:15px;line-height:1.7}
.map ol{margin:0;padding-left:1.3em}
.inline-confirm{display:flex;gap:var(--s1);flex-wrap:wrap;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:var(--s2);font-size:16px}
ol.plain{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
/* screen-change cue */
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--accent);padding:24px;cursor:pointer}
.ov.ok{background:var(--ok)}
.ov-card{text-align:center;color:#fff;max-width:520px}
.ov-sub{font-size:18px;opacity:.9}
.ov-main{font-family:var(--display);font-size:32px;line-height:1.4;font-weight:700;text-wrap:balance}
.ov.show{animation:ovfade 1.3s ease both}
@keyframes ovfade{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:no-preference){.ov.show .ov-card{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}}
main{animation:fade .45s ease-out both}
.banner{animation:fade .5s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){main{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}}
</style>

<div class="app">
  <header class="top">
    <button type="button" class="brand" id="homeBtn"><span>相続準備ガイド <span class="tag">試作品</span></span><small>はじめの画面へ</small></button>
    <button class="util" id="noteBtn" type="button">ノート <b id="noteN">0</b></button>
    <button class="util strong" id="askBtn" type="button">相談する</button>
  </header>
  <div class="layout"><main id="screen"></main><aside id="aside" aria-label="いまの状況"></aside></div>
</div>
<div class="ov" id="ov" hidden role="status" aria-live="assertive"><div class="ov-card"><p class="ov-sub" id="ovSub"></p><p class="ov-main" id="ovMain"></p></div></div>

<script>
const GLOSS={
 "支店名":"通帳の表紙や1ページ目に書いてある「◯◯支店」のことです。",
 "権利証":"家や土地の持ち主であることを示す書類です。「登記識別情報」と書かれた紙の場合もあります。",
 "法定相続人":"法律で決まっている、財産を受け継ぐ人です。夫・妻と、子ども（子どもがいなければ親や兄弟）がなります。",
 "基礎控除":"相続税がかからない金額の上限です。3,000万円＋600万円×法定相続人の数で計算します。",
 "相続税":"亡くなった人の財産を受け取ったときにかかる税金です。財産が基礎控除より少なければかかりません。",
 "暦年贈与":"1年間（1月〜12月）に110万円までの贈与なら、贈与税がかからない仕組みです。",
 "二次相続":"夫・妻のどちらかが亡くなった後、残った人が亡くなったときの相続です。",
 "成年後見":"判断が難しくなった人のお金や契約を、家庭裁判所が選んだ人が代わりに管理する仕組みです。",
 "家族信託":"元気なうちに、信頼できる家族にお金や家の管理を任せる契約です。",
 "名義預金":"家族の名前の口座でも、実際には本人のお金として管理している預金です。相続財産として扱われます。",
 "自筆証書遺言":"自分で書く遺言書です。法務局に預ける制度もあります。",
 "公正証書遺言":"公証役場で、公証人に作ってもらう遺言書です。形式の不備で無効になりにくい方法です。",
 "非課税枠":"死亡保険金のうち、500万円×法定相続人の数までは相続税がかかりません。"
};
/* ending-note pages: the container every step's result is written into */
const PAGES=[["family","家族のこと"],["money","お金のこと"],["tax","相続税のこと"],["land","家や土地のこと"],["leave","残したいもの"],["care","医療・介護のこと"],["words","家族へのことば"],["things","身の回りのこと"]];
const WORRIES=[
 {id:"where",label:"通帳や保険がどこにあるか、家族が知らない",short:"お金の置き場所を家族が知らない",agenda:"財産の一覧に、漏れがないかの確認"},
 {id:"tax",label:"相続税がかかるか分からない",short:"相続税がかかるか分からない",agenda:"相続税の正確な試算と、今からできる対策"},
 {id:"leave",label:"子どもに何を残せばいいか分からない",short:"何を残すか決められない",agenda:"遺言の作り方と、生きているうちに渡す方法"},
 {id:"dementia",label:"認知症になったら、お金はどうなるか心配",short:"判断が難しくなった後が心配",agenda:"家族が代わりにお金を出せる仕組み（信託など）"},
 {id:"talk",label:"家族で話したことがない",short:"家族とまだ話せていない",agenda:"家族に何を伝えておくとよいか"},
 {id:"tidy",label:"家や物の片付けが手つかず",short:"片付けが手つかず",agenda:"片付けや、お墓のことの相談先"},
 {id:"land",label:"家や土地をどうするか決めていない",short:"家や土地をどうするか決めていない",agenda:"家や土地の名義と、引き継ぎ方"}
];
const Q={
 spouse:{q:"夫・妻はいらっしゃいますか？",short:"夫・妻",a:["いる","いない","わからない"]},
 kids:{q:"お子さんは何人いますか？",short:"お子さん",a:["0人","1人","2人","3人以上","わからない"]},
 sibs:{q:"ご兄弟は何人いますか？",short:"ご兄弟",a:["0人","1人","2人","3人以上","わからない"],if:A=>A.kids==="0人"},

function work(s,sfx,st){sfx=sfx||"";st=st||"now";

      <button type="button" class="btn primary wide" id="doCalc${sfx}"${dis}>分かった　次へ${dest}</button></div>`;

function finish(s,text){S.slideFrom=selfSteps(routeOf(S.worries[0])).indexOf(s);S.errId=null;S.done[s.id]=true;const lb=noteLabel(s);if(s.page&&text!=null)S.notes[s.id]={page:s.page,label:lb,text};

}

  if(name==="q"){const qs=qList();const rows=[];if(S.worries.length)rows.push(`<dt>気になること</dt><dd>${S.worries.map(w=>wById(w).short).join("、")}</dd>`);
    qs.forEach((id,i)=>{if(i<S.qi-1&&S.ans[id])rows.push(`<dt>${Q[id].short}</dt><dd>${Array.isArray(S.ans[id])?S.ans[id].join("・"):S.ans[id]}</dd>`)});
    return rows.length?`<section class="panel"><h2 style="font-size:17px">これまでの答え</h2><dl class="dl">${rows.join("")}</dl></section>`:""}
  return "";
}
function render(){side("");(V[S.screen]||V.home)();side(sideFor(S.screen));document.body.classList.toggle("wide",S.screen==="route");document.body.classList.toggle("narrow",S.screen!=="route"&&S.screen!=="q");$("noteN").textContent=filledPages();$("noteBtn").hidden=!(filledPages()||topicItems().length)}
$("ov").onclick=()=>{$("ov").hidden=true};
try{S.pcLayout=localStorage.getItem(KEY+"-lay2")||"a"}catch(e){S.pcLayout="a"}
if(window.matchMedia){const mq=window.matchMedia("(min-width:900px)");const rr=()=>{if(S.screen==="route"||S.screen==="q")render()};mq.addEventListener?mq.addEventListener("change",rr):mq.addListener&&mq.addListener(rr)}
$("askBtn").onclick=()=>{if(S.screen!=="consult")show("consult")};
$("homeBtn").onclick=()=>{if(S.screen!=="home")show("home")};
$("noteBtn").onclick=()=>{if(S.screen!=="note")show("note")};
render();
</script>
